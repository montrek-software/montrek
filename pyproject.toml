[tool.black]
line-length = 88


[tool.mypy]
plugins = ["mypy_django_plugin.main"]
# Only report errors for the files/packages passed on the command line
# (e.g. `mypy baseclasses`); imported first-party modules are analysed silently.
follow_imports = "silent"

[[tool.mypy.overrides]]
# Third-party packages without type hints or installed stubs.
module = [
  "_plotly_utils.*",
  "bleach.*",
  "celery.*",
  "debug_toolbar.*",
  "decouple.*",
  "django_pandas.*",
  "encrypted_fields.*",
  "kombu.*",
  "mozilla_django_oidc.*",
  "networkx.*",
  "openpyxl.*",
  "pandas.*",
  "plotly.*",
  "psycopg2.*",
  "pypandoc.*",
  "requests.*",
  "rest_framework.*",
  "weasyprint.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The mt_* extension apps are separate git repositories nested in montrek/.
# The pre-commit hook excludes them from discovery, but the django-stubs plugin
# still loads their models (they are installed apps), so silence them here.
module = [
  "mt_accounting.*",
  "mt_competo.*",
  "mt_economic_common.*",
  "mt_llm.*",
  "mt_tools.*",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "montrek.settings"

[tool.ruff]
target-version = "py312"
line-length = 88


exclude = [
  "migrations",
  "settings",
]
[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "RET",  # return statements
  "PLR",  # pylint refactor (complexity)
  "UP",   # pyupgrade
  "S",    # security rules
]

ignore = [
  "E501",    # line length (black handles)
  "B008",    # function calls in defaults (common in Django)
  "PLR0913", # too many arguments (views/forms often need this)
  "PLR2004", # magic values (often clearer than constants)
  "RET504",
  "S608",    #  SQL injection false positives (Django ORM)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "PLR0915", # complex test functions
  "S101",    # asserts allowed in tests
  "S106",    # hardcoded password literals are common/acceptable in tests
]



[tool.bandit]
exclude_dirs = ["tests", "migrations"]
