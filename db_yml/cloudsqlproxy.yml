###

services:
  db:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    restart: "unless-stopped"
    networks:
      - montrek_network
    volumes:
      - ./secrets/${SQLPROXY_KEYFILE}:/db/key.json:ro
    ports:
      # Bound to loopback: host tooling still reaches it, the network does not.
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    command: >
      --address=0.0.0.0
      --port=${DB_PORT}
      --credentials-file=/db/key.json
      ${SQLPROXY_INSTANCE}
