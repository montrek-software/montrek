services:
  db:
    image: postgres:16
    shm_size: 256m
    command: postgres -c jit=off -p ${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_USER: ${DB_USER}
    ports:
      # Bound to loopback: host tooling still reaches it, the network does not.
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: "unless-stopped"
    networks:
      - montrek_network
