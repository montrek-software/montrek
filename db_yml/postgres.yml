services:
  db:
    image: postgres:16
    shm_size: 256m
    # Memory defaults fit a 4 GB host that also runs web + workers; on 8 GB set
    # DB_SHARED_BUFFERS=1GB and DB_EFFECTIVE_CACHE_SIZE=3GB in .env. SSD storage.
    command: >
      postgres -p ${DB_PORT}
      -c jit=off
      -c shared_buffers=${DB_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_USER: ${DB_USER}
    ports:
      # Bound to loopback: host tooling still reaches it, the network does not.
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: "unless-stopped"
    networks:
      - montrek_network
