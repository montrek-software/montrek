<!-- TABS -->
<div class="row">
  <div class="col-12">
    <ul class="nav nav-tabs">
      {% for tab in tab_elements %}
        <li class="nav-item">
          <a
            class="nav-link {% if tab.active %}active{% endif %}"
            id="{{ tab.html_id }}"
            href="{{ tab.link }}"
          >
            {{ tab.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>

<!-- ACTIONS -->
<div class="row m-2">
  <div class="col-12 p-2">
    {% for action in actions %}
    <a
      id="{{ action.action_id }}"
      href="{{ action.link }}"
      class="btn btn-custom py-0 px-1"
      data-bs-toggle="tooltip"
      data-bs-title="{{ action.hover_text }}"
    >
      <span class="bi bi-{{ action.icon }} fs-4" />
    </a>
    {% endfor %}
  </div>
</div>

<!-- FROZEN PROCEDURE NOTICE -->
{% if frozen_notice %}
  <div class="row m-2">
    <div class="col-12">
      <div id="id_frozen_notice" class="alert alert-warning py-1 px-2 mb-0" role="status">
        <span class="bi bi-lock"></span> {{ frozen_notice }}
      </div>
    </div>
  </div>
{% endif %}
