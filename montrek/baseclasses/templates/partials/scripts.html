<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>
<script
  src="https://cdn.plot.ly/plotly-2.32.0.min.js"
  integrity="sha384-7TVmlZWH60iKX5Uk7lSvQhjtcgw2tkFjuwLcXoRSR4zXTyWFJRm9aPAguMh7CIra"
  crossorigin="anonymous"
></script>
<script
  src="https://unpkg.com/htmx.org@1.9.6/dist/htmx.min.js"
  integrity="sha256-y7cjwwXPbWMVyJCQmBVSNYhQni4JKln4z8SohYKWidU="
  crossorigin="anonymous"
></script>
<script
  src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"
  integrity="sha256-Huqxy3eUcaCwqqk92RwusapTfWlvAasF6p2rxV6FJaE="
  crossorigin="anonymous"
></script>
<script>
  // Delegated tooltip: one instance covers current and HTMX-swapped elements
  new bootstrap.Tooltip(document.body, { selector: '[data-bs-toggle="tooltip"]' });

  function initFlatpickr(root) {
    if (typeof flatpickr !== "function") {
      return;
    }
    var selector = 'input[type="date"]:not(.flatpickr-input)';
    var scope = (root instanceof Element) ? root : document;
    var elements = [];
    if (scope instanceof Element && scope.matches(selector)) {
      elements.push(scope);
    }
    scope.querySelectorAll(selector).forEach(function(el) {
      elements.push(el);
    });
    elements.forEach(function(el) {
      var options = {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d/m/Y",
        allowInput: true,
      };
      if (el.value) {
        options.defaultDate = el.value;
      } else if (el.required) {
        options.defaultDate = new Date();
      }
      flatpickr(el, options);
    });
  }

  document.addEventListener("DOMContentLoaded", function() { initFlatpickr(); });
  document.addEventListener("htmx:afterSwap", function(e) { initFlatpickr(e.detail.elt); });
</script>
