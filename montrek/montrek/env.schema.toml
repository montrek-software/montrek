# Every runtime variable a montrek install reads, wherever it is set: the
# environment, a `NAME_FILE`, a secret under /run/secrets or secrets/, or .env.
# montrek/env_schema.py checks the values against it; its docstring says when a
# problem stops the start-up and when it is only a warning.
#
# An extension app documents its own variables in an env.schema.toml next to its
# apps.py, in the same format.
#
# Fields: type (str, int, bool, csv or choice), description, and optionally
# required, secret, choices (for choice), default (documentation only -- the
# effective default stays at the call site) and scope ("app" when Django reads
# it, "compose" when only the compose files and shell scripts do, "build" for a
# build- or CI-time credential, which belongs in .env.build and never in .env).
#
# Every config("NAME") in settings.py must have an entry here; a test enforces it.

###########################################
# App
###########################################

[PROJECT_NAME]
type = "str"
default = "default"
description = "Short name of the install, used in host names (montrek.<name>, <name>.<DEPLOY_HOST>, auth-<name>.<DEPLOY_HOST>)."

[DEPLOY_HOST]
type = "str"
default = "127.0.0.1"
description = "Host name or address the install is reached at."

[DEPLOY_PORT]
type = "str"
default = "1339"
description = "Port the install is reached at."

[EXTRA_ALLOWED_HOSTS]
type = "csv"
default = ""
description = "Comma-separated host names accepted in addition to the ones derived from PROJECT_NAME and DEPLOY_HOST, e.g. a load balancer or custom domain."

[EXTRA_CSRF_TRUSTED_ORIGINS]
type = "csv"
default = ""
description = "Comma-separated origins (scheme://host[:port]) trusted for CSRF in addition to the derived ones."

[NAVBAR_APPS]
type = "str"
default = ""
description = "Comma-separated apps shown in the navigation bar."

[NAVBAR_RENAME]
type = "str"
default = ""
description = "Comma-separated app::Label pairs renaming navigation entries; * stands for a space."

[HOME_URL]
type = "str"
default = "home"
description = "URL name of the start page."

[NAVBAR_HOME_URL]
type = "str"
description = "URL name the navigation bar's home entry links to. Defaults to HOME_URL."

[NAVBAR_HOME_LABEL]
type = "str"
default = "Home"
description = "Label of the navigation bar's home entry; * stands for a space."

[NUMBER_FORMATTING]
type = "choice"
choices = ["en", "de"]
default = "en"
description = "Number formatting in tables and reports."

[LANGUAGE_CODE]
type = "str"
default = "en-us"
description = "Django language code."

[SEND_TABLE_BY_MAIL_LIMIT]
type = "int"
default = 10000
description = "Row count above which a table export is sent by mail instead of downloaded."

###########################################
# Client branding
###########################################

[PRIMARY_COLOR]
type = "str"
description = "Primary colour as a hex code."

[SECONDARY_COLOR]
type = "str"
description = "Secondary colour as a hex code."

[FONT_NAME]
type = "str"
default = ""
description = "Font for the web frontend, charts, Excel and PDFs; must be installed where it renders."

[CUSTOM_CSS]
type = "csv"
default = ""
description = "Comma-separated static paths of client stylesheets loaded after the gold theme."

[CLIENT_LOGO_PATH]
type = "str"
description = "URL or static path of the client logo."

[CLIENT_LOGO_LINK]
type = "str"
default = "https://example.com"
description = "Where the client logo links to."

###########################################
# Django
###########################################

[SECRET_KEY]
type = "str"
required = true
secret = true
description = "Django secret key."

[DEBUG]
type = "bool"
default = false
description = "Django debug mode. Refused on a non-local DEPLOY_HOST unless MONTREK_ALLOW_DEBUG is set."

[MONTREK_ALLOW_DEBUG]
type = "bool"
default = false
description = "Allows DEBUG on a non-local DEPLOY_HOST."

[LOG_LEVEL]
type = "str"
default = "WARNING"
description = "Log level of the console handler (DEBUG, INFO, WARNING, ERROR, CRITICAL)."

[ADMIN_EMAIL]
type = "str"
description = "Email address of the Django superuser."

[ADMIN_PASSWORD]
type = "str"
secret = true
description = "Password of the Django superuser, used only for the Django admin."

[ADMIN_MAILING_LIST]
type = "str"
default = ""
description = "Comma-separated addresses that receive admin notifications."

[MONTREK_SECRETS_DIR]
type = "str"
description = "Directory searched for secret files instead of /run/secrets and secrets/. Read from the environment only."

###########################################
# Database
###########################################

[DB_ENGINE]
type = "choice"
choices = ["postgres", "postgres_ext", "cloudsqlproxy", "mariadb"]
default = "postgres"
description = "Database backend. postgres_ext requires SSL; mariadb is deprecated."

[DB_NAME]
type = "str"
default = "montrek_db"
description = "Database name."

[DB_USER]
type = "str"
default = "root"
description = "Database user."

[DB_PASSWORD]
type = "str"
required = true
secret = true
description = "Database password."

[DB_HOST]
type = "str"
default = "localhost"
description = "Database host; the compose service name (db) in the docker setup."

[DB_PORT]
type = "int"
default = 3306
description = "Database port."

[DB_BACKUP_FORMAT]
type = "choice"
choices = ["custom", "plain"]
default = "custom"
scope = "compose"
description = "Format written by make docker-db-backup: pg_dump custom archive or plain SQL."

[DB_BACKUP_KEEP_DAYS]
type = "int"
default = 30
scope = "compose"
description = "Backups older than this are pruned unless they are the last one of a month."

[MONTREK_DB_BACKUP_FOLDER]
type = "str"
default = "db_backups"
scope = "compose"
description = "Where database backups are written."

[SQLPROXY_INSTANCE]
type = "str"
scope = "compose"
description = "Cloud SQL instance connection name, for DB_ENGINE=cloudsqlproxy."

[SQLPROXY_KEYFILE]
type = "str"
scope = "compose"
description = "Service account key file under secrets/, for DB_ENGINE=cloudsqlproxy."

###########################################
# Email
###########################################

[EMAIL_HOST]
type = "str"
description = "SMTP host. Unset writes mails to files under EMAIL_FILE_PATH."

[EMAIL_FILE_PATH]
type = "str"
description = "Directory mails are written to when EMAIL_HOST is unset. Defaults to montrek/sent_emails; the app image sets /tmp/sent_emails."

[EMAIL_PORT]
type = "int"
default = 587
description = "SMTP port."

[EMAIL_USE_TLS]
type = "bool"
default = true
description = "Use STARTTLS for SMTP."

[EMAIL_HOST_USER]
type = "str"
default = ""
description = "SMTP user."

[EMAIL_HOST_PASSWORD]
type = "str"
secret = true
default = ""
description = "SMTP password."

[EMAIL_TEMPLATE]
type = "str"
default = "mail_templates/montrek_mail_template.html"
description = "Template mails are rendered with."

[DEFAULT_FROM_EMAIL]
type = "str"
description = "Sender address. Defaults to EMAIL_HOST_USER."

###########################################
# Celery
###########################################

[CELERY_BROKER_URL]
type = "str"
default = "redis://redis:6379"
description = "Celery broker URL."

[CELERY_RESULT_BACKEND]
type = "str"
default = "redis://redis:6379"
description = "Celery result backend URL."

[CELERY_TASK_ALWAYS_EAGER]
type = "bool"
default = true
description = "Run tasks in the calling process instead of a worker."

[CELERY_TASK_EAGER_PROPAGATES]
type = "bool"
default = false
description = "Re-raise exceptions of eagerly run tasks."

[CELERY_TASK_ACKS_LATE]
type = "bool"
default = true
description = "Acknowledge a task once it has run, so one interrupted by a stopping worker runs again. Tasks must be safe to run twice."

[CELERY_WORKER_SOFT_SHUTDOWN_TIMEOUT]
type = "str"
default = "8.0"
description = "Seconds a prefork worker gives running tasks to finish on SIGTERM before it returns them to the queue. Keep it below the time the platform waits before killing the container (10 s for compose and Cloud Run)."

[CELERY_VISIBILITY_TIMEOUT]
type = "int"
default = 36000
description = "Seconds after which Redis hands an unacknowledged task to another worker. Longer than the longest task."

[ENABLE_FAST_WORKER]
type = "bool"
default = false
scope = "compose"
description = "Run the fast worker (gevent, many short tasks at once). Without it the parallel worker runs the fast queue's tasks."

[WORKER_CONCURRENCY]
type = "int"
scope = "compose"
description = "Tasks a worker runs at once; set per worker service. Defaults: parallel 4, fast 50 per CPU (at most 500). The sequential worker always runs one."

[PARALLEL_WORKER_CONCURRENCY]
type = "int"
scope = "compose"
description = "WORKER_CONCURRENCY of the parallel worker in the compose setup."

[FAST_WORKER_CONCURRENCY]
type = "int"
scope = "compose"
description = "WORKER_CONCURRENCY of the fast worker in the compose setup, with ENABLE_FAST_WORKER. Each running task may hold a database connection."

[SET_CONCURRENCY]
type = "int"
scope = "compose"
description = "Former name of PARALLEL_WORKER_CONCURRENCY, still read."

[FLOWER_PORT]
type = "int"
scope = "compose"
description = "Port of the Flower UI."

[FLOWER_PASSWORD]
type = "str"
secret = true
scope = "compose"
description = "Basic-auth password of the Flower UI. Falls back to ADMIN_PASSWORD."

###########################################
# Login through an OpenID provider (OIDC)
###########################################

[ENABLE_OIDC]
type = "bool"
default = false
description = "Log in through the OpenID provider at OIDC_ISSUER_URL instead of the Django login form. Implied by ENABLE_KEYCLOAK."

[OIDC_ISSUER_URL]
type = "str"
default = ""
description = "Issuer URL of the OpenID provider, e.g. https://auth.example.com/realms/montrek for Keycloak or https://login.microsoftonline.com/<tenant id>/v2.0 for Entra ID. Its endpoints are read from <issuer>/.well-known/openid-configuration. Empty: the Keycloak realm KEYCLOAK_REALM at auth-<PROJECT_NAME>.<DEPLOY_HOST>."

[OIDC_CLIENT_ID]
type = "str"
default = ""
description = "Client id montrek is registered with at the provider. Falls back to KEYCLOAK_CLIENT_ID."

[OIDC_CLIENT_SECRET]
type = "str"
secret = true
default = ""
description = "Client secret. Falls back to KEYCLOAK_CLIENT_SECRET. Empty for a public client with PKCE."

[OIDC_SCOPES]
type = "str"
default = "openid email"
description = "Space-separated scopes requested at login."

###########################################
# Keycloak
###########################################

[ENABLE_KEYCLOAK]
type = "bool"
default = false
description = "Run Keycloak with the install (compose, nginx) and log in through it."

[KEYCLOAK_PORT]
type = "str"
default = ""
description = "Port Keycloak is reached at."

[KEYCLOAK_REALM]
type = "str"
default = ""
description = "Keycloak realm, used when OIDC_ISSUER_URL is empty."

[KEYCLOAK_CLIENT_ID]
type = "str"
default = ""
description = "OIDC client id; OIDC_CLIENT_ID takes precedence."

[KEYCLOAK_CLIENT_SECRET]
type = "str"
secret = true
default = ""
description = "OIDC client secret; OIDC_CLIENT_SECRET takes precedence."

[KEYCLOAK_ADMIN_PASSWORD]
type = "str"
secret = true
scope = "compose"
description = "Keycloak realm admin password. Falls back to ADMIN_PASSWORD."

[KEYCLOAK_DB_PASSWORD]
type = "str"
secret = true
scope = "compose"
description = "Password of the Keycloak database."

[KEYCLOAK_DB_HOST]
type = "str"
default = "keycloak-db"
scope = "compose"
description = "Keycloak database host, for the backup scripts."

[KEYCLOAK_DB_PORT]
type = "int"
default = 5432
scope = "compose"
description = "Keycloak database port, for the backup scripts."

[KEYCLOAK_DB_NAME]
type = "str"
default = "keycloak"
scope = "compose"
description = "Keycloak database name, for the backup scripts."

[KEYCLOAK_DB_USER]
type = "str"
default = "keycloak"
scope = "compose"
description = "Keycloak database user, for the backup scripts."

###########################################
# Containers and ingress
###########################################

[APP_PORT]
type = "int"
scope = "compose"
description = "Port gunicorn (or runserver) listens on inside the container."

[DO_MONTREK_STARTUP_TASKS]
type = "bool"
default = true
scope = "compose"
description = "Run migrate, collectstatic and the superuser script on every web start. Off where a release step (SERVICE=release) runs them once per deployment."

[GUNICORN_WORKERS]
type = "int"
default = 4
scope = "compose"
description = "Gunicorn worker processes."

[GUNICORN_THREADS]
type = "int"
default = 2
scope = "compose"
description = "Threads per gunicorn worker."

[GUNICORN_TIMEOUT]
type = "int"
default = 120
scope = "compose"
description = "Gunicorn request timeout in seconds."

[CONTAINER_REGISTRY]
type = "str"
default = "ghcr.io"
scope = "compose"
description = "Registry of the app image."

[CONTAINER_NAMESPACE]
type = "str"
default = "montrek-software"
scope = "compose"
description = "Namespace of the app image."

[CONTAINER_IMAGE]
type = "str"
default = "montrek-container"
scope = "compose"
description = "Name of the app image."

[CONTAINER_TAG]
type = "str"
default = "latest"
scope = "compose"
description = "Tag of the app image."

[USER_ID]
type = "int"
scope = "compose"
description = "Host uid the containers run as (PUID)."

[GROUP_ID]
type = "int"
scope = "compose"
description = "Host gid the containers run as (PGID)."

[MONTREK_CA_CERT]
type = "str"
default = "/montrek/nginx/certs/fullchain.crt"
scope = "compose"
description = "Instance CA certificate to trust, e.g. for a self-signed Keycloak. Installed system-wide when the container starts as root, otherwise appended to a private bundle that REQUESTS_CA_BUNDLE points at."

[MEDIA_X_ACCEL_REDIRECT]
type = "str"
default = ""
description = "Internal nginx location that serves MEDIA_ROOT, e.g. /protected-uploads/. When set, uploads are checked by Django and sent by nginx via X-Accel-Redirect; when empty, Django sends them itself."

[REQUESTS_CA_BUNDLE]
type = "str"
default = "/etc/ssl/certs/ca-certificates.crt"
description = "CA bundle the OIDC client verifies against. Set by the entrypoint when it builds a private bundle; read from the environment only."

[MONTREK_ALLOW_ROOT]
type = "bool"
default = false
scope = "compose"
description = "Lets the entrypoint run the app as root."

[MONTREK_SECRETS_DIR_HOST]
type = "str"
default = "secrets"
scope = "compose"
description = "Host directory make secrets-init writes secret files to."

[TLS_CERT_DIR]
type = "str"
default = "./nginx/certs"
scope = "compose"
description = "Host directory mounted into nginx at /etc/tls."

[SSL_CERT_PATH]
type = "str"
default = "/etc/tls/fullchain.crt"
scope = "compose"
description = "Certificate path inside the nginx container."

[SSL_KEY_PATH]
type = "str"
default = "/etc/tls/cert.key"
scope = "compose"
description = "Key path inside the nginx container."

[DNS_RESOLVER]
type = "str"
default = "127.0.0.11"
scope = "compose"
description = "Resolver nginx uses for upstream names."

###########################################
# Build and CI (.env.build, never .env)
###########################################

[GIT_USER]
type = "str"
scope = "build"
description = "Registry user make git-build-montrek-container pushes the image as."

[GIT_PAT]
type = "str"
secret = true
scope = "build"
description = "Registry access token with the write:package scope."

[SONARCUBE_URL]
type = "str"
scope = "build"
description = "SonarQube server for make local-sonarqube-scan."

[SONARCUBE_TOKEN]
type = "str"
secret = true
scope = "build"
description = "SonarQube token for make local-sonarqube-scan."
