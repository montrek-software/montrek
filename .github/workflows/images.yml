name: Container images

# montrek-base (Dockerfile): the system packages. Rebuilt when its inputs change,
# weekly for security updates, or by hand.
# montrek-app (Dockerfile.app): montrek-base plus code, locked dependencies and
# static files. Built on every push to main, on version tags and after the
# weekly base rebuild, from the exact base digest it was tested with. The weekly
# build makes latest, which the extensions' tests run on, follow the base that
# client images are built from; it moves latest and the sha tag of main's head.
#
# montrek-base is signed with cosign, keyless: the signature names this
# workflow on refs/heads/main as its signer (GitHub's OIDC token, Sigstore's
# certificate and transparency log), so no signing key is stored anywhere.
# Client builds (montrek-deploy's bin/build-image.sh) use a base only with that
# signature. A base pushed from another branch or by hand is not used.
#
# Both go to the Forgejo package registry. Needs the repository secrets
# FORGEJO_REGISTRY_USER and FORGEJO_REGISTRY_TOKEN (a token with write:package);
# the variable FORGEJO_REGISTRY overrides the registry host.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Rebuild montrek-base as well"
        type: boolean
        default: false

env:
  REGISTRY: ${{ vars.FORGEJO_REGISTRY || 'forgejo.montrek-software.de' }}
  NAMESPACE: montrek-software

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild_base }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "schedule" || "$REBUILD" == "true" ]]; then
            changed=true
          elif [[ "$EVENT" == "push" && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "$BEFORE" 2>/dev/null; then
            # The inputs of ./Dockerfile, as .dockerignore allows them in.
            if git diff --quiet "$BEFORE" HEAD -- Dockerfile .dockerignore \
              bin/entrypoints/montrek-entrypoint.sh .github/workflows/images.yml; then
              changed=false
            else
              changed=true
            fi
          else
            changed=false
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

  base:
    needs: changes
    if: needs.changes.outputs.base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token cosign signs with.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_REGISTRY_USER }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/montrek-base
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/montrek-base@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  app:
    needs: [changes, base]
    # Runs when the base was skipped, not when it failed.
    if: ${{ !cancelled() && needs.base.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_REGISTRY_USER }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - id: base
        env:
          BUILT_DIGEST: ${{ needs.base.outputs.digest }}
          BASE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/montrek-base
        run: |
          # Pin the base by digest, so the image is built from the one it says.
          set -o pipefail
          digest="$BUILT_DIGEST"
          if [[ -z "$digest" ]]; then
            digest="$(docker buildx imagetools inspect "$BASE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')" || true
          fi
          if [[ -z "$digest" ]]; then
            echo "::error::$BASE:latest is not in the registry. Run this workflow with 'Rebuild montrek-base' ticked."
            exit 1
          fi
          echo "image=$BASE@$digest" >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/montrek-app
          # latest means main. The default (auto) would also tag every stable
          # version tag as latest, so a hotfix tagged on an older commit would
          # move it backwards.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          load: true
          tags: montrek-app:smoke
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            MONTREK_REVISION=${{ github.sha }}
      - name: Smoke test
        run: |
          # No database: the start-up tasks are off and /health/ does not need
          # one. Proves the image starts unprivileged and serves.
          docker run -d --name smoke -p 8000:8000 \
            -e SERVICE=web -e APP_PORT=8000 -e DO_MONTREK_STARTUP_TASKS=0 \
            -e SECRET_KEY=smoke -e DB_PASSWORD=smoke -e DEPLOY_HOST=localhost \
            montrek-app:smoke
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8000/health/; then
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            MONTREK_REVISION=${{ github.sha }}
