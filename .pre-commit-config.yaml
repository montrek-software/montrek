repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.34.0
    hooks:
      - id: djlint
        args: [--ignore=H021]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
  # Runs the project's own mypy (language: system): the django-stubs plugin
  # imports the settings and needs every app dependency installed, which an
  # isolated pre-commit environment would not have. Checks the whole project,
  # since a change can break the types of files that import it; mypy's cache
  # keeps this to a few seconds.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd montrek && mypy .'
        language: system
        types: [python]
        pass_filenames: false
  # bandit finds insecure code; gitleaks finds committed credentials. .env is
  # gitignored, but a `git add -f` or a new *.env variant should still be caught
  # before it reaches a remote.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-merge-conflict
