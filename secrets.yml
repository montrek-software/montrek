# Compose file-based secrets, layered on top of docker-compose.yml.
#
# What this changes: each secret stops being an `env_file:`/`environment:` value
# -- which Compose materializes into the container config, where `docker inspect`
# and `docker compose config` hand it to anyone in the `docker` group -- and
# becomes a file bind-mounted read-only at `/run/secrets/<name>` in only the
# services that need it. The container config then records a path, not a value,
# and a secret is no longer inherited by every child process of the entrypoint.
#
# A secret file is named after the variable it replaces, lowercased:
# `secrets/db_password` provides `DB_PASSWORD`. montrek/configuration.py and
# montrek_load_secrets() in bin/lib/load-env.sh both map the name back, so the
# montrek services need no per-variable wiring. The third-party images do, via
# the `*_FILE` convention they already support, which is set below.
#
# This is an opt-in overlay: Compose refuses to start when a `file:` source is
# missing, so bin/docker/run.sh adds `-f secrets.yml` only once
# `make secrets-init` has created every file listed at the bottom. Until then
# the stack runs exactly as before, reading everything from .env.
#
# What it does not do: encrypt anything at rest, or hide anything from root or
# the docker group. See docs/secrets.md.

# Every montrek service resolves its secrets by file name, so the list is the
# whole wiring. celery_beat and the workers get the same set as web except
# admin_password, which only web's create_superuser needs.
x-montrek-app-secrets: &montrek-app-secrets
  - secret_key
  - db_password
  - email_host_password
  - keycloak_client_secret

services:
  web:
    secrets:
      - secret_key
      - db_password
      - admin_password
      - email_host_password
      - keycloak_client_secret

  celery_beat:
    secrets: *montrek-app-secrets

  sequential_worker:
    secrets: *montrek-app-secrets

  parallel_worker:
    secrets: *montrek-app-secrets

  fast_worker:
    secrets: *montrek-app-secrets

  db:
    # Both conventions are set because the `db` service is whichever engine
    # db_yml/${DB_ENGINE}.yml defines. Each image reads only its own variable
    # and ignores the other; the cloudsqlproxy and postgres_ext stand-ins read
    # neither.
    #
    # The plain variables are pinned empty, not merely left to interpolate to
    # nothing. Both entrypoints reject `X` and `X_FILE` being set together --
    # postgres exits with "both POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are
    # set (but are exclusive)" and restart-loops -- and the engine files still
    # pass `POSTGRES_PASSWORD: ${DB_PASSWORD:-}`, which is non-empty whenever
    # the invoking shell happens to have DB_PASSWORD exported. Empty counts as
    # unset for both images, so the *_FILE variable is what takes effect.
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_PASSWORD: ""
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  flower:
    # Flower has no *_FILE support, so the basic-auth credential is assembled in
    # the shell that already wraps the command. It goes into the environment of
    # that one process rather than into argv, where `ps` inside the container
    # would show it.
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      FLOWER_PORT: ${FLOWER_PORT}
      # Overrides the base file's admin:${FLOWER_PASSWORD} so no form of the
      # password reaches the container config; the command sets it instead.
      FLOWER_BASIC_AUTH: ""
    command:
      - |
        password="$$(cat /run/secrets/flower_password)"
        if [ -z "$$password" ]; then
          echo "ERROR: secrets/flower_password is empty." >&2
          echo "  Flower accepts 'admin' with an empty password, so refusing to" >&2
          echo "  serve the UI. Write a password to secrets/flower_password." >&2
          exit 1
        fi
        FLOWER_BASIC_AUTH="admin:$$password"
        export FLOWER_BASIC_AUTH
        unset password
        exec celery --broker="$$CELERY_BROKER_URL" flower --port="$$FLOWER_PORT"
    secrets:
      - flower_password

  keycloak-db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password

  keycloak:
    # keycloak/bin/init-realm.sh resolves these three from their *_FILE
    # pointers before it templates the realm JSON, which is the only place the
    # client secret and the admin password are used.
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ""
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB_PASSWORD: ""
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KEYCLOAK_CLIENT_SECRET: ""
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
    secrets:
      - keycloak_admin_password
      - keycloak_db_password
      - keycloak_client_secret

# Keep in step with MONTREK_SECRET_NAMES in bin/lib/secrets.sh, which
# init-secrets.sh checks on every run.
secrets:
  secret_key:
    file: ./secrets/secret_key
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password
  email_host_password:
    file: ./secrets/email_host_password
  flower_password:
    file: ./secrets/flower_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret
